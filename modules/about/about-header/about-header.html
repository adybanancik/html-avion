<header class="about-header" data-about-header>
    <div class="about-header__top">
        <a
                class="about-header__logo"
                href="/"
                aria-label="Avion homepage"
        >
            Avion
        </a>

        <nav
                class="about-header__links"
                id="about-navigation"
                aria-label="Company navigation"
        >
            <a href="/about.html" aria-current="page">
                About us
            </a>

            <span>Contact</span>
            <span>Blog</span>
        </nav>

        <div class="about-header__actions">
            <button
                    class="about-header__button"
                    type="button"
                    aria-label="Search"
            >
                <img
                        src="/images/icons/search.svg"
                        alt=""
                        width="16"
                        height="16"
                />
            </button>

            <button
                    class="about-header__button"
                    type="button"
                    aria-label="Shopping cart"
            >
                <img
                        src="/images/icons/Shopping--cart.svg"
                        alt=""
                        width="16"
                        height="16"
                />
            </button>

            <button
                    class="about-header__button"
                    type="button"
                    aria-label="Account"
            >
                <img
                        src="/images/icons/User--avatar.svg"
                        alt=""
                        width="16"
                        height="16"
                />
            </button>
        </div>

        <button
                class="about-header__button about-header__toggle"
                type="button"
                aria-label="Toggle company navigation"
                aria-expanded="false"
                aria-controls="about-navigation"
                data-about-menu
        >
            <img
                    src="/images/product-page/menu.svg"
                    alt=""
                    width="16"
                    height="16"
            />
        </button>
    </div>

    <nav
            class="about-header__categories"
            aria-label="Product categories"
            tabindex="0"
    >
        <ul>
            <li><span>All products</span></li>
            <li><span>Plant pots</span></li>
            <li><span>Ceramics</span></li>
            <li><span>Tables</span></li>
            <li><span>Chairs</span></li>
            <li><span>Crockery</span></li>
            <li><span>Tableware</span></li>
            <li><span>Cutlery</span></li>
        </ul>
    </nav>
</header>
