<aside
        class="product-banner"
        aria-label="Delivery offer"
        data-delivery-banner
>
    <div class="product-banner__content">
        <img
                src="/images/product-page/delivery-white.svg"
                alt=""
                width="16"
                height="16"
        />

        <p>
            Free delivery on all orders over £50 with code easter checkout
        </p>
    </div>

    <button
            class="product-banner__close"
            type="button"
            aria-label="Dismiss delivery offer"
            data-banner-close
    >
        <img
                src="/images/product-page/close.svg"
                alt=""
                width="24"
                height="24"
        />
    </button>
</aside>
