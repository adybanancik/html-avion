<header class="product-header" data-product-header>
    <div class="container product-header__inner">
        <a
                class="product-header__logo"
                href="/"
                aria-label="Avion homepage"
        >
            Avion
        </a>

        <nav
                class="product-header__nav"
                id="product-navigation"
                aria-label="Product categories"
        >
            <ul class="product-header__menu">
                <li><span>Plant pots</span></li>
                <li><span>Ceramics</span></li>
                <li><span>Tables</span></li>
                <li><span>Chairs</span></li>
                <li><span>Crockery</span></li>
                <li><span>Tableware</span></li>
                <li><span>Cutlery</span></li>
            </ul>
        </nav>

        <div class="product-header__actions">
            <button
                    class="product-header__action"
                    type="button"
                    aria-label="Search"
            >
                <img
                        src="/images/icons/search.svg"
                        alt=""
                        width="16"
                        height="16"
                />
            </button>

            <button
                    class="product-header__action"
                    type="button"
                    aria-label="Shopping cart"
            >
                <img
                        src="/images/icons/Shopping--cart.svg"
                        alt=""
                        width="16"
                        height="16"
                />
            </button>

            <button
                    class="product-header__action"
                    type="button"
                    aria-label="Account"
            >
                <img
                        src="/images/icons/User--avatar.svg"
                        alt=""
                        width="16"
                        height="16"
                />
            </button>

            <button
                    class="product-header__action product-header__toggle"
                    type="button"
                    aria-label="Toggle categories"
                    aria-expanded="false"
                    aria-controls="product-navigation"
                    data-menu-toggle
            >
                <img
                        src="/images/product-page/menu.svg"
                        alt=""
                        width="16"
                        height="16"
                />
            </button>
        </div>
    </div>
</header>
